<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>snip</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e3749"/>
      <stop offset="1" stop-color="#161a23"/>
    </linearGradient>
    <linearGradient id="sel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#d9e7fb"/>
    </linearGradient>
    <clipPath id="tileClip"><rect width="256" height="256" rx="58"/></clipPath>
    <clipPath id="selClip"><rect x="58" y="62" width="150" height="132"/></clipPath>
  </defs>
  <g clip-path="url(#tileClip)">
    <rect width="256" height="256" fill="url(#tile)"/>
    <!-- the frozen, dimmed screen -->
    <g fill="#fff" opacity=".10">
      <rect x="30" y="34" width="120" height="12" rx="6"/>
      <rect x="30" y="92" width="196" height="14" rx="7"/>
      <rect x="30" y="122" width="150" height="14" rx="7"/>
      <rect x="30" y="152" width="196" height="14" rx="7"/>
      <rect x="30" y="212" width="90" height="12" rx="6"/>
    </g>
  </g>
  <!-- the selection: the same screen at full brightness, framed in snip's accent blue -->
  <rect x="58" y="62" width="150" height="132" fill="url(#sel)"/>
  <g clip-path="url(#selClip)" fill="#a9bbd4">
    <rect x="30" y="92" width="196" height="14" rx="7"/>
    <rect x="30" y="122" width="150" height="14" rx="7"/>
    <rect x="30" y="152" width="196" height="14" rx="7"/>
  </g>
  <rect x="58" y="62" width="150" height="132" fill="none" stroke="#469bff" stroke-width="7"/>
  <!-- annotation, drawn like snip's: red arrow -->
  <path d="M196 214 L150 168" stroke="#eb3434" stroke-width="13" stroke-linecap="round"/>
  <path d="M132 150 L170 159 L141 188 Z" fill="#eb3434" stroke="#eb3434" stroke-width="4" stroke-linejoin="round"/>
</svg>
